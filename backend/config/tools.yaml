tools:
  sast:
    - id: semgrep
      name: Semgrep
      image: semgrep/semgrep:latest
      tooltip: >
        Semgrep finds bugs and security issues using pattern-matching rules.
        It supports 30+ languages and auto-detects your stack. Great for custom
        org-wide policies or running the community ruleset out of the box.
      hint: >
        Works best on Python, JavaScript/TypeScript, Go, Java, Ruby, PHP, C/C++,
        and more. Upload a ZIP of your source tree or paste a Git URL — Semgrep
        will auto-select the right rules for your languages.
      supports_spdx: false
      input_type: source

    - id: opengrep
      name: OpenGrep
      image: ghcr.io/opengrep/opengrep:latest
      tooltip: >
        OpenGrep is the open-source continuation of Semgrep OSS — fully
        community-driven with no proprietary telemetry. It runs the same
        pattern-matching engine with support for 30+ languages and is
        compatible with the existing Semgrep rule ecosystem.
      hint: >
        Works with the same rule configs as Semgrep. Upload a ZIP or paste a
        Git URL — OpenGrep will auto-detect languages and apply the default
        ruleset. A great alternative if you need a fully open-source scanner.
      supports_spdx: false
      input_type: source

  sca:
    - id: trivy-sca
      name: Trivy (SCA)
      image: aquasec/trivy:latest
      tooltip: >
        Trivy scans your dependency manifests and lock files for known CVEs using
        the OSV, NVD, and GitHub Advisory databases. It covers npm, pip, Maven,
        Go modules, Cargo, Composer, and more.
      hint: >
        Make sure your lock files are included in the ZIP — package-lock.json,
        requirements.txt, go.sum, pom.xml, Cargo.lock etc. Trivy reads them all
        automatically. SPDX SBOM export is available after scanning.
      supports_spdx: true
      input_type: source

    - id: grype
      name: Grype
      image: anchore/grype:latest
      tooltip: >
        Grype (by Anchore) scans filesystems and container images for known
        vulnerabilities using an offline-capable database sourced from NVD, GHSA,
        and OS vendor advisories. Pairs naturally with Syft for full SBOM-driven
        scanning.
      hint: >
        Upload a ZIP of your project directory. Grype auto-detects package
        manifests (npm, pip, Maven, Go, Ruby, .NET and more) and matches them
        against its vulnerability database. Produces CVE IDs and fix versions.
      supports_spdx: false
      input_type: source

    - id: syft
      name: Syft (SBOM)
      image: anchore/syft:latest
      tooltip: >
        Syft (by Anchore) generates a Software Bill of Materials (SBOM) from
        your source tree, listing every dependency, its version, license, and
        PURL. Use it to understand your software supply chain and export a
        standards-compliant SPDX SBOM.
      hint: >
        Upload a ZIP or paste a Git URL. Syft produces an inventory of all
        detected packages — results appear as INFO findings (no severity, just
        visibility). SPDX SBOM export is available for downstream vulnerability
        scanning or compliance workflows.
      supports_spdx: true
      input_type: source

    - id: owasp-dc
      name: OWASP Dependency Check
      image: owasp/dependency-check:latest
      tooltip: >
        OWASP Dependency Check identifies project dependencies with published CVEs
        using the NVD database. It excels at Java/Maven/Gradle and .NET projects,
        and also covers Python, Ruby, and Node.
      hint: >
        First run downloads the NVD data (~200MB) which takes 2-5 minutes — grab
        a coffee. Subsequent scans reuse the cached data and are much faster.
        Best results with Java or .NET projects that have clear dependency manifests.
      supports_spdx: false
      input_type: source

  iac:
    - id: kics
      name: Checkmarx KICS
      image: checkmarx/kics:latest
      tooltip: >
        KICS (Keeping Infrastructure as Code Secure) scans Terraform, Helm charts,
        Dockerfiles, Kubernetes YAML, CloudFormation, Ansible, and more for
        misconfigurations and policy violations.
      hint: >
        Drop in your entire repo ZIP — KICS auto-detects IaC file types across
        subdirectories. Covers 2,000+ queries across Terraform (AWS, GCP, Azure),
        Kubernetes, Docker, and Helm.
      supports_spdx: false
      input_type: source

    - id: checkov
      name: Checkov
      image: bridgecrew/checkov:latest
      tooltip: >
        Checkov (by Prisma Cloud) scans Terraform, CloudFormation, Kubernetes,
        Helm, Dockerfile, Serverless, and ARM templates for security
        misconfigurations and compliance violations against CIS, NIST, PCI-DSS,
        SOC2, and HIPAA benchmarks.
      hint: >
        Upload a ZIP of your IaC directory. Checkov auto-detects framework types
        across subdirectories and applies 1,000+ built-in policies. Results
        include the check ID, resource name, file path, and a guideline link for
        remediation.
      supports_spdx: false
      input_type: source

  secrets:
    - id: gitleaks
      name: Gitleaks
      image: zricethezav/gitleaks:latest
      tooltip: >
        Gitleaks detects hardcoded secrets — API keys, passwords, tokens, and
        credentials — in your source code using a comprehensive library of regex
        rules combined with entropy analysis. Covers AWS, GCP, GitHub, Slack,
        Stripe, and hundreds of other secret types.
      hint: >
        Upload a ZIP of your source tree or paste a Git URL. Gitleaks scans all
        file types recursively. Results show the file, line number, and the rule
        that matched. Secrets are not echoed back in full — only the matched
        fragment is shown so the report itself is safe to share.
      supports_spdx: false
      input_type: source

    - id: trufflehog
      name: TruffleHog
      image: trufflesecurity/trufflehog:latest
      tooltip: >
        TruffleHog v3 finds leaked credentials using 700+ detectors covering
        cloud providers, SaaS APIs, databases, and private keys. Its standout
        feature is live verification — it actively tests found credentials to
        confirm whether they are still valid before flagging them.
      hint: >
        Upload a ZIP or paste a Git URL. Verified secrets (confirmed live) are
        marked CRITICAL; unverified matches are HIGH. TruffleHog uses embedded
        detectors and does not need network access to scan — verification calls
        are made to the relevant APIs only for confirmed pattern matches.
      supports_spdx: false
      input_type: source

  build:
    - id: trivy-image
      name: Trivy (Image Scan)
      image: aquasec/trivy:latest
      tooltip: >
        Trivy scans Docker images for OS package CVEs (Alpine, Debian, Ubuntu,
        RHEL, CentOS) and application dependency vulnerabilities without running
        the image. Checks the image filesystem layer by layer.
      hint: >
        Provide a registry reference (e.g. nginx:latest, python:3.12-slim) to pull
        and scan, or upload a .tar.gz exported with "docker save myimage | gzip >
        image.tar.gz". SPDX SBOM export is available after scanning.
      supports_spdx: true
      input_type: image

  mobile:
    - id: mobsfscan
      name: MobSF (mobsfscan)
      image: opensecurity/mobsfscan:latest
      tooltip: >
        mobsfscan is the static analysis engine from Mobile Security Framework
        (MobSF). It detects insecure code patterns in Android (Java, Kotlin,
        XML) and iOS (Swift, Objective-C) source code, mapping findings to
        OWASP Mobile Top 10 and MASVS.
      hint: >
        Upload a ZIP of your Android or iOS source tree. mobsfscan auto-detects
        platform type and applies the relevant ruleset. Findings include the rule
        ID, OWASP Mobile mapping, CWE, and the exact file and line number where
        the issue was detected.
      supports_spdx: false
      input_type: source
